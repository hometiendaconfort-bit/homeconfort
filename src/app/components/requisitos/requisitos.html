<section class="credito-card">

  <h2>
    <i class="bx bx-credit-card"></i>
      Requisitos para solicitar crédito
  </h2>

  <ul>
  <li *ngFor="let requisito of requisitos">
    <i [class]="requisito.icono"></i>
      <div class="info">
        
        <span>{{ requisito.descripcion }}</span>
      </div>
  </li>
  </ul>

  <div class="cta">
    <i class="bx bx-message-dots"></i>
      <span>Escríbenos y te ayudamos a gestionar tu credito en solo 15 min</span>
  </div>


  <a
    class="btn-credito"
    [routerLink]="['/productoss']"
    [queryParams]="{ tipo: 'credito' }"
  >
  <i class="bx bx-credito-card"></i>
      Ver productos a crédito
  </a>

</section>
