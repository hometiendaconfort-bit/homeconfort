<header class="header">
  <!-- NUEVO: Barra pagos - arriba del navbar -->
  <div class="top-pay-bar">
    <span>Paga con:</span>
    <span class="pay-badge addi">Addi</span>
    <span class="pay-badge siste">Sistecrédito</span>
    <span class="pay-extra">Nequi | Bancolombia | Daviplata | Bre-B</span>
  </div>

  <div class="nav-container">
    <!-- Izquierda: Menu + Logo -->
    <div class="nav-left">
      <button class="menu-btn" (click)="toggleSidebar()">
        <i class="bx bx-menu"></i>
      </button>
      <a routerLink="/login" class="logos">
        <img src="assets/img/logo2.jpeg" alt="Logo CONFORT HOME" class="logo-img">
        <span class="logo">CONFORT<br>HOME DEL EJE</span>
      </a>
    </div>

    <!-- Centro: Buscador arriba -->
    <div class="nav-center">
      <a routerLink="/home" class="nav-link-desktop">Inicio</a>
      <a routerLink="/home" class="nav-link-desktop">Combos</a>
      <a routerLink="/productoss" class="nav-link-desktop">Productos</a>
    </div>

    <div class="buscador-top">
        <i class="bx bx-search"></i>
        <input type="text"
               placeholder="Buscar colchón, manilla, base cama..."
               (input)="buscar($any($event.target).value)">
        <a routerLink="/productoss"><i class="bx bx-store"></i></a>
    </div>

    <!-- Derecha: Iconos limpios -->
    <div class="nav-right">
      <a routerLink="/"><i class="bx bxs-home"></i></a>
      <a href="https://www.instagram.com/conforthoome" target="_blank"><i class='bx bxl-instagram'></i></a>
      <a href="https://w.app/confort_home" target="_blank"><i class='bx bxl-whatsapp'></i></a>
      <a href="https://www.facebook.com/people/Confort-HOME/100084116541948/" target="_blank"><i class='bx bxl-facebook'></i></a>
    </div>
  </div>

  <!-- Buscador para celular -->
  <div class="buscador-mobile">
    <i class="bx bx-search"></i>
    <input type="text"
           placeholder="Buscar colchón, manilla, base cama..."
           (input)="buscar($any($event.target).value)">
    <a routerLink="/productoss"><i class="bx bx-store"></i></a>
  </div>

  <!-- Barra financiación -->
  <div class="finance-bar">
    <a routerLink="requisitos">¿Necesitas Financiación? Solicita tu crédito aquí <i class='bx bx-chevron-right'></i></a>
  </div>
</header>
