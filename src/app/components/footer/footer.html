<!-- Footer principal del sitio -->
<footer class="footer" *ngFor="let footer of footers">

  <!-- Contenedor general del footer -->
  <div class="footer-contenedor">
    
    <!-- Sección de información del sitio -->
    <div class="footer-section">
      <h3>dormiCoR</h3>
      <p>{{ footer.descripcion }}</p>
      <p>{{ footer.descripcion2 }}</p>
    </div>

    <!-- Sección de enlaces de navegación -->
    <div class="footer-section">
      <h4>Enlaces</h4>
      <ul>
        <li><a href="#">Inicio</a></li>
      </ul>
    </div>

    <!-- Sección de información de contacto -->
    <div class="footer-section">
      <h4>Contacto</h4>
      <p>{{ footer.email }}</p>
      <p>{{ footer.telefono }}</p>
    </div>

  </div>

  <!-- Parte inferior del footer -->
  <div class="footer-bottom">
    <p>{{ footer.texto }}</p>
  </div>

</footer>
